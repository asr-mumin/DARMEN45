<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DARMEN — Питч-дек (7 слайдов с 3D)</title>
<style>
:root{--bg:#031014;--b:#0B7F8C;--b2:#14B8C4;--ac:#F26B4E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);font-family:Manrope,"Segoe UI",Roboto,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#st{container-type:size;position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;background:radial-gradient(90cqw 70cqh at 80% 10%,#0e5f6b,#07262d 60%,#031014);color:#e8fbfc;user-select:none;cursor:pointer}
.orb{position:absolute;border-radius:50%;filter:blur(5cqw);opacity:.5;animation:ob 14s ease-in-out infinite}
.o1{width:30cqw;height:30cqw;left:-8cqw;top:-8cqw;background:#14B8C4}.o2{width:26cqw;height:26cqw;right:-6cqw;bottom:-10cqw;background:#F26B4E;opacity:.28;animation-delay:-5s}
@keyframes ob{50%{transform:translate(6cqw,4cqw) scale(1.2)}}
#vw{position:absolute;inset:0;perspective:140cqw}
.sc{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:3.5cqw 6cqw;opacity:0;pointer-events:none;transform:translateX(40cqw) rotateY(-55deg) scale(.8);filter:blur(1cqw);transition:transform 1.3s cubic-bezier(.2,.8,.2,1),opacity 1s,filter 1.2s;transform-style:preserve-3d}
.sc.on{opacity:1;transform:none;filter:none}.sc.out{transform:translateX(-40cqw) rotateY(55deg) scale(.8)}

/* Левая часть со списком карточек (в стиле референса) */
.tx{width:48cqw;transform-style:preserve-3d}
.slide-header{margin-bottom:1.5cqw}
.slide-header h2{font-size:2.2cqw;font-weight:800;color:#fff;margin:0 0 .3cqw}
.slide-header span{font-size:1.1cqw;font-weight:700;color:var(--b2);text-transform:uppercase;letter-spacing:.12cqw}

.cards-list{display:flex;flex-direction:column;gap:1.1cqw}
.p-row{background:linear-gradient(160deg,#ffffff10,#ffffff04);border:.12cqw solid #ffffff20;border-radius:1.2cqw;padding:1.1cqw 1.5cqw;backdrop-filter:blur(1cqw);display:flex;align-items:center;gap:1.5cqw;transform:rotateX(30deg) translateY(2cqw);opacity:0}
.on .p-row{transform:none;opacity:1;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .5s;transition-delay:calc(.3s + var(--i)*.12s)}
.p-num{font-size:1.6cqw;font-weight:900;color:var(--b2);min-width:2.2cqw}
.p-content b{display:block;font-size:1.35cqw;color:#fff;margin-bottom:.2cqw;font-weight:700}
.p-content span{font-size:1.1cqw;color:#a9d3d8;line-height:1.3;display:block}

/* Правая часть с 3D объектами */
.vs{width:36cqw;height:34cqw;display:flex;align-items:center;justify-content:center;position:relative;transform-style:preserve-3d}

/* 3D Кубик логотипа / фишек */
.cube{width:13cqw;height:13cqw;position:relative;transform-style:preserve-3d;animation:rc 14s linear infinite}
@keyframes rc{from{transform:rotateX(-18deg) rotateY(0)}to{transform:rotateX(-18deg) rotateY(360deg)}}
.cube div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#0B7F8Cdd,#14B8C4bb);border:.2cqw solid #fff6;border-radius:1.4cqw;font-size:1.3cqw;font-weight:800;box-shadow:inset 0 0 3cqw #fff3;color:#fff}
.cube div i{font-style:normal;font-size:4cqw;display:block}

/* 3D Карта */
.m3{width:34cqw;height:26cqw;position:relative;transform-style:preserve-3d;transform:rotateX(55deg) rotateZ(-22deg);animation:mf 10s ease-in-out infinite}
@keyframes mf{50%{transform:rotateX(46deg) rotateZ(-12deg) translateZ(1.5cqw)}}
.m3>svg{position:absolute;inset:0;width:100%;height:100%;border-radius:1cqw;box-shadow:0 3cqw 7cqw rgba(0,0,0,.65),0 0 0 .3cqw #fff3}
.pn{position:absolute;transform-origin:50% 100%;transform:translate(-50%,-100%) rotateZ(22deg) rotateX(-55deg);opacity:0;color:var(--c,#0B7F8C)}
.on .pn{animation:dr .8s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(.8s + var(--i)*.15s)}
@keyframes dr{from{opacity:0;transform:translate(-50%,-100%) translateZ(9cqw) rotateZ(22deg) rotateX(-55deg)}to{opacity:1;transform:translate(-50%,-100%) rotateZ(22deg) rotateX(-55deg)}}
.pn svg{display:block;width:2.4cqw;height:3.4cqw;filter:drop-shadow(0 .3cqw .3cqw #0007)}.pn svg path{fill:currentColor;stroke:#fff;stroke-width:2}.pn svg circle{fill:#fff}
.pl{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:.1cqw;white-space:nowrap;background:#fff;color:#0E2A33;border:.2cqw solid var(--c);border-radius:1cqw;padding:0 .6cqw;font:800 1.1cqw/1.8cqw sans-serif}
.pn.f .pl{background:var(--c);color:#fff}
.sear{position:absolute;left:0;top:-4.5cqw;background:#fff;color:#0E2A33;border-radius:1cqw;padding:.7cqw 1.3cqw;font-size:1.4cqw;font-weight:700;box-shadow:0 1cqw 2cqw #0006;white-space:nowrap}
.me{position:absolute;width:1.8cqw;height:1.8cqw;margin:-.9cqw;border-radius:50%;background:#2F6BFF;border:.3cqw solid #fff;opacity:0}.on .me{opacity:1;transition:opacity .5s .5s}
.me::after{content:"";position:absolute;inset:-.3cqw;border-radius:50%;border:.25cqw solid #2F6BFF;animation:pl 2s ease-out infinite}
@keyframes pl{to{transform:scale(4.5);opacity:0}}

/* 3D Сетка карточек продукта */
.grid-3d{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw;width:36cqw;transform-style:preserve-3d}
.cd{background:linear-gradient(160deg,#ffffff16,#ffffff06);border:.12cqw solid #ffffff30;border-radius:1.4cqw;padding:1.4cqw;backdrop-filter:blur(1cqw);transform:rotateY(90deg);opacity:0}
.on .cd{transform:none;opacity:1;transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .6s;transition-delay:calc(.5s + var(--i)*.2s)}
.cd b{display:block;font-size:1.4cqw;margin-bottom:.3cqw;color:#fff}.cd span{font-size:1.1cqw;color:#b4dde1;line-height:1.3;display:block}.cd i{font-style:normal;font-size:2.8cqw;display:block;margin-bottom:.4cqw}

/* Управление */
#bar{position:absolute;left:0;right:0;bottom:.9cqw;display:flex;align-items:center;justify-content:center;gap:1cqw;z-index:7}
#bar button{background:#ffffff1f;color:#fff;border:0;border-radius:50%;width:3.2cqw;height:3.2cqw;font-size:1.4cqw;cursor:pointer}
.vol-wrap{display:flex;align-items:center;background:#ffffff1f;border-radius:50cqw;padding:0 .8cqw;height:3.2cqw}
#vol{width:5vw;max-width:70px;cursor:pointer;accent-color:var(--b2)}
#pg{display:flex;gap:.6cqw;position:absolute;bottom:0;left:0;right:0;height:.45cqw;z-index:8}#pg i{flex:1;background:#ffffff35;cursor:pointer}#pg i.d{background:#14B8C488}#pg i.c{background:#14B8C4}
#cn{font-size:1.2cqw;color:#9cc;min-width:5cqw;text-align:center}

#go{position:absolute;inset:0;z-index:9;background:radial-gradient(70cqw 50cqw at 50% 40%,#0e5f6bf0,#031014f5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;text-align:center}
#go p{margin:0;font-size:1.7cqw;color:#a9d3d8}#gb{background:var(--ac);color:#fff;border:0;border-radius:99cqw;padding:1.3cqw 4cqw;font-size:2.2cqw;font-weight:800;cursor:pointer;box-shadow:0 1cqw 3cqw #F26B4E66}
.btn-site{display:inline-block;background:var(--ac);color:#fff;text-decoration:none;padding:1.2cqw 3cqw;border-radius:99cqw;font-size:1.8cqw;font-weight:800;box-shadow:0 .8cqw 2cqw #F26B4E66;margin-top:1.5cqw;transition:transform .2s}
.btn-site:hover{transform:scale(1.05)}
.lg{font-size:8cqw;font-weight:900;letter-spacing:.5cqw;background:linear-gradient(90deg,#fff,#14B8C4);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head><body>
<div id="st"><div class="orb o1"></div><div class="orb o2"></div><div id="vw"></div><div id="pg"></div>
<div id="bar">
  <button id="bp" aria-label="Назад">⏮</button>
  <button id="bn" aria-label="Вперёд">⏭</button>
  <button id="bm" aria-label="Звук эффектов">🔊</button>
  <div class="vol-wrap"><input type="range" id="vol" min="0" max="1" step="0.05" value="0.35"></div>
  <button id="bs" aria-label="Музыка">🎵</button>
  <button id="bf" aria-label="Во весь экран">⛶</button>
  <span id="cn"></span>
</div>
<div id="go"><div class="lg">DARMEN</div><p>Классический питч-дек · 7 слайдов с 3D-моделями</p><button id="gb">▶ Начать питч</button></div></div>
<script>
const $=s=>document.querySelector(s);
let bd="";for(let i=0;i<14;i++)for(let j=0;j<10;j++)if((i*7+j*13)%5<3&&!(i==6||i==7))bd+=`<rect x="${12+i*27}" y="${10+j*27}" width="${13+(i*j)%8}" height="${11+(i+j)%7}"/>`;
const rd=(v,c,w)=>[0,1,2,3,4].map(k=>`<path d="${v?`M${60+k*70} 0V280`:`M0 ${40+k*55}H400`}" stroke="${c}" stroke-width="${w}"/>`).join("");
const MAP=`<svg viewBox="0 0 400 280"><rect width="400" height="280" fill="#f2efe9"/><g fill="#d9d0c9" stroke="#c4b7ab" stroke-width=".5">${bd}</g><g fill="#c8facc"><rect x="14" y="14" width="86" height="62" rx="3"/><rect x="262" y="190" width="120" height="74"/></g><rect x="296" y="14" width="86" height="70" fill="#add19e"/><g fill="none" stroke-linecap="round">${rd(1,"#fff",5)}${rd(0,"#fff",5)}<path d="M0 150C80 118 140 190 220 150S340 112 400 142" stroke="#aad3df" stroke-width="16"/><path d="M200 0V280M0 95H400" stroke="#d9a35e" stroke-width="10"/><path d="M200 0V280M0 95H400" stroke="#fcd6a4" stroke-width="8"/></g></svg>`;
const pin=(x,y,c,l,i,f)=>`<div class="pn ${c}${f?" f":""}" style="left:${x}%;top:${y}%;--i:${i}">${l?`<b class="pl">${l}</b>`:""}<svg viewBox="0 0 30 42"><path d="M15 2C7.5 2 2 7.6 2 14.7 2 24.600 15 40 15 40s13-15.400 13-25.300C28 7.600 22.500 2 15 2z"/><circle cx="15" cy="14.500" r="6"/></svg></div>`;
const face=(n,e,t)=>`<div style="transform:rotateY(${n*90}deg) translateZ(6.5cqw)"><span><i>${e}</i>${t}</span></div>`;

// Ровно 7 слайдов классического питча
const S=[
{
  sub: "01 / 07 · ТИТУЛЬНЫЙ СЛАЙД",
  title: "Презентация DARMEN",
  rows: [
    ["01", "Название компании", "DARMEN — экосистема быстрой помощи и здравоохранения."],
    ["02", "Охват рынка", "Работает в 16 городах Казахстана на трёх языках (RU, KZ, EN)."],
    ["03", "Основная миссия", "Здоровье рядом: моментальный поиск лекарств и клиник."]
  ],
  vs: `<div class="cube">${face(0,"💊","Лекарства")}${face(1,"🏥","Больницы")}${face(2,"📍","Карта")}${face(3,"⚡","Сервис")}</div>`
},
{
  sub: "02 / 07 · ПРОБЛЕМА",
  title: "С чем сталкиваются пациенты",
  rows: [
    ["01", "Потеря времени", "Обзвон десятков аптек в поисках редкого препарата во время болезни."],
    ["02", "Скрытые цены", "Отсутствие единого источника актуальных цен на лекарства в городе."],
    ["03", "Трудности с поиском", "Сложно быстро найти профильную больницу или свободную лабораторию."]
  ],
  vs: `<div class="grid-3d">${[["⏳","Стресс","Поиск лекарств в экстренной ситуации"],["💸","Переплаты","Отсутствие сравнения цен в аптеках"],["🏥","Очереди","Непонятный график работы больниц"],["❌","Дефицит","Сложный поиск доноров крови"]].map((c,k)=>`<div class="cd" style="--i:${k}"><i>${c[0]}</i><b>${c[1]}</b><span>${c[2]}</span></div>`).join("")}</div>`
},
{
  sub: "03 / 07 · РЕШЕНИЕ",
  title: "Как наш продукт решает проблему",
  rows: [
    ["01", "Единая платформа", "Всё необходимое для здоровья собрано на одной интерактивной карте."],
    ["02", "Реальное время", "Актуальные данные о наличии лекарств, ценах и статусе аптек."],
    ["03", "Точные маршруты", "Автоопределение геолокации и прокладка маршрута до клиники."]
  ],
  vs: `<div class="m3">${MAP}<path class="rt" pathLength="1" d="M0 0"/></svg>${[[30,38,"ok","1 910 ₸",0],[62,26,"ok","1 890 ₸",1],[46,64,"near","1 700 ₸",2,1]].map(p=>pin(...p)).join("")}<div class="me" style="left:40%;top:52%"></div></div>`
},
{
  sub: "04 / 07 · ПРОДУКТ И ФУНКЦИОНАЛ",
  title: "Ключевые модули сервиса",
  rows: [
    ["01", "Аптеки и лекарства", "Мгновенный поиск по названию с ценами и остатками."],
    ["02", "Больницы и клиники", "Контакты, графики работы и фильтры по специализации."],
    ["03", "Диагностика и врачи", "Прайсы на МРТ, УЗИ, анализы и онлайн-запись."]
  ],
  vs: `<div class="cube">${face(0,"💊","Аптеки")}${face(1,"🏥","Клиники")}${face(2,"🧪","Анализы")}${face(3,"🩸","Доноры")}</div>`
},
{
  sub: "05 / 07 · РЫНОК И ПОТЕНЦИАЛ",
  title: "Масштаб и целевая аудитория",
  rows: [
    ["01", "TAM (Общий рынок)", "Все жители и пациенты Республики Казахстан (19+ млн человек)."],
    ["02", "SAM (Доступный рынок)", "Активные пользователи смартфонов в 16 крупнейших городах."],
    ["03", "SOM (Целевая доля)", "Пользователи, регулярно покупающие лекарства и ищущие клиники."]
  ],
  vs: `<div class="grid-3d">${[["📈","16 Городов","Активное покрытие по всей стране"],["👥","Высокий спрос","Ежедневная потребность в аптеках"],["📱","Мультиплатформа","Смартфоны, планшеты, ПК"],["🌐","3 Языка","Доступно для всех граждан (RU, KZ, EN)"]].map((c,k)=>`<div class="cd" style="--i:${k}"><i>${c[0]}</i><b>${c[1]}</b><span>${c[2]}</span></div>`).join("")}</div>`
},
{
  sub: "06 / 07 · КОМАНДА И ТРАКЦИЯ",
  title: "Почему нам доверяют",
  rows: [
    ["01", "Опытная команда", "Эксперты в сфере разработки цифровых платформ и медицины."],
    ["02", "Стабильный рост", "Постоянное пополнение базы данных аптек, больниц и врачей."],
    ["03", "Высокое качество", "Надежная архитектура, быстрая загрузка и поддержка 24/7."]
  ],
  vs: `<div class="cube">${face(0,"🚀","Рост")}${face(1,"⭐","Качество")}${face(2,"🛡","Надежность")}${face(3,"💡","Инновации")}</div>`
},
{
  sub: "07 / 07 · ЗАПРОС И КОНТАКТЫ",
  title: "Присоединяйтесь к DARMEN",
  rows: [
    ["01", "Интерактивная карта", "Оцените все преимущества платформы прямо сейчас."],
    ["02", "Открыты к партнерству", "Сотрудничество с аптеками, клиниками и медицинскими центрами."],
    ["03", "Готовый продукт", "Платформа полностью запущена и работает в сети."]
  ],
  vs: `<div style="text-align:center"><div class="lg" style="font-size:5cqw">DARMEN</div><p style="color:#a9d3d8;font-size:1.3cqw;margin:.5cqw 0 1.5cqw">Здоровье — рядом</p><a href="https://asr-mumin.github.io/DARMEN2/" target="_blank" class="btn-site">Открыть сайт 🚀</a></div>`
}
];

$('#vw').innerHTML=S.map(s=>`
  <section class="sc">
    <div class="tx">
      <div class="slide-header">
        <span>${s.sub}</span>
        <h2>${s.title}</h2>
      </div>
      <div class="cards-list">
        ${s.rows.map((r,k)=>`
          <div class="p-row" style="--i:${k}">
            <div class="p-num">${r[0]}</div>
            <div class="p-content">
              <b>${r[1]}</b>
              <span>${r[2]}</span>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="vs">${s.vs}</div>
  </section>
`).join('');

const sc=[...document.querySelectorAll('.sc')];
$('#pg').innerHTML=S.map((_,k)=>`<i data-k="${k}"></i>`).join('');
let i=-1,muted=false,mOn=true,AC=null,MG=null;

const bgm=new Audio('https://zvukogram.com/mp3/cats/1322/digital-vibrations_88309.mp3');
bgm.loop=true;
bgm.preload='auto';
bgm.volume=0.35;

function ai(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.14;MG.connect(AC.destination)}catch(e){AC=null}}
function tone(f,t,d,v,ty){const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.05)}
function mus(on){if(on){bgm.play().catch(()=>{})}else{bgm.pause()}}

$('#vol').oninput=e=>{
  const val = e.target.value;
  bgm.volume = val;
  if(MG) MG.gain.value = val * 0.4;
};

$('#bs').onclick=e=>{e.stopPropagation();mOn=!mOn;$('#bs').textContent=mOn?'🎵':'🔕';mus(mOn)};

function whoosh(){
  if(!AC||!mOn||muted)return;
  const t=AC.currentTime,n=Math.floor(AC.sampleRate*1.2),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let k=0;k<n;k++)d[k]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;
  f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(3500,t+.6);f.frequency.exponentialRampToValueAtTime(600,t+1.2);
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.4);g.gain.linearRampToValueAtTime(0,t+1.2);
  s.connect(f);f.connect(g);g.connect(MG);s.start(t);tone(1318.5,t+.45,1.2,.5);tone(1760,t+.6,1.4,.35);
}

function show(n){
  if(n<0)n=0;
  if(n>=S.length){end();return;}
  const pv=sc[i];
  if(pv){
    pv.classList.remove('on');
    pv.classList.add('out');
    setTimeout(()=>pv.classList.remove('out'),1300);
    whoosh();
  }
  i=n;
  sc[i].classList.add('on');
  [...$('#pg').children].forEach((e,j)=>e.className=j<i?'d':j==i?'c':'');
  $('#cn').textContent=(i+1)+' / '+S.length;
}

function end(){
  $('#gb').textContent='↻ Начать заново';
  mus(false);
  $('#go').style.display='flex';
  sc[i]&&sc[i].classList.remove('on');
  i=-1;
}

$('#gb').onclick=e=>{
  e.stopPropagation();
  ai();
  if(AC&&AC.state=='suspended')AC.resume();
  mus(mOn);
  $('#go').style.display='none';
  show(0);
};

$('#bn').onclick=e=>{e.stopPropagation();if(i>=0)show(i+1);};
$('#bp').onclick=e=>{e.stopPropagation();if(i>=0)show(i-1);};

$('#bm').onclick=e=>{
  e.stopPropagation();
  muted=!muted;
  $('#bm').textContent=muted?'🔇':'🔊';
  if(MG) MG.gain.value = muted ? 0 : $('#vol').value * 0.4;
};

$('#pg').onclick=e=>{
  const k=e.target.dataset.k;
  if(k!=null&&i>=0)show(+k);
};

$('#bf').onclick=e=>{
  document.fullscreenElement?document.exitFullscreen():$('#st').requestFullscreen&&$('#st').requestFullscreen();
};

document.onkeydown=e=>{
  if(e.key=='ArrowRight'&&i>=0)show(i+1);
  if(e.key=='ArrowLeft'&&i>=0)show(i-1);
};
</script></body></html>
